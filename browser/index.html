<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="application-name" content="Browser">
<meta name="theme-color" content="#000000">
<title>Browser</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:600px;height:600px;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif;user-select:none}
#app{width:600px;height:600px;display:flex;flex-direction:column;position:relative}
#head{padding:12px 24px;font-size:22px;font-weight:700;border-bottom:2px solid #222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head b{color:#0f0}
#body{flex:1;overflow-y:auto;scrollbar-width:none;padding:10px 26px;font-size:21px;line-height:1.3;white-space:pre-wrap;word-break:break-word}
#body .rowm{padding:8px 0;border-left:6px solid transparent;padding-left:16px;margin-left:-26px}
#body .rowm.sel{border-left-color:#0f0;background:#0a140a;color:#0f0}
#foot{padding:12px 20px;font-size:19px;color:#bbb;border-top:2px solid #222;min-height:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ov{position:absolute;inset:0;background:#000;display:none;flex-direction:column;z-index:5}
#kblab{padding:10px 20px;font-size:20px;color:#0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ovi{width:calc(100% - 40px);margin:0 20px;min-height:80px;background:#000;border:2px solid #0f0;color:#fff;font-size:26px;padding:6px 14px;font-family:inherit}
#kb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:6px 10px}
.kbrow{display:flex;gap:5px;justify-content:center}
.kbkey{width:50px;height:56px;display:flex;align-items:center;justify-content:center;font-size:23px;border:2px solid #333;background:#0a0a0a;flex-shrink:0}
.kbkey.sel{border-color:#0f0;color:#0f0;background:#0a1e0a}
.kbkey.sp{width:64px;font-size:19px;color:#8cf}
.kbkey.sp.sel{color:#0f0;border-color:#0f0}
</style>
</head>
<body>
<div id="app">
  <div id="head">Browser <b id="ctx">меню</b></div>
  <div id="body"></div>
  <div id="foot">↑↓ · Enter выбрать · Esc назад</div>
  <div id="ov"><div id="kblab"></div><input id="ovi" enterkeyhint="go" autocomplete="off" autocorrect="off" spellcheck="false"><div id="kb"></div></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DEF=[['Hacker News','https://news.ycombinator.com'],['Википедия','https://ru.m.wikipedia.org'],['Reddit','https://old.reddit.com'],['РБК','https://www.rbc.ru']];
let bms=JSON.parse(localStorage.getItem('brBm')||'null')||DEF;
let screen='menu',sel=0,pages=[],page=0,url='',pagesText='';
function foot(t){$('foot').textContent=t;}
function say(t){ if(!('speechSynthesis' in window))return; const u=new SpeechSynthesisUtterance(t.slice(0,900)); speechSynthesis.cancel(); speechSynthesis.speak(u); }
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ===== ввод: нативный композер + D-pad запасная сетка ===== */
const LAT=['qwertyuiop','asdfghjkl','zxcvbnm'];
const RU=['йцукенгшщзх','фывапролджэ','ячсмитьбюё'];
const SP=['EN','http','://','.','␣','⌫','OK','✕'];
let kbOn=false,kbMode='field',kbBuf='',kbR=0,kbC=0,kbRu=false,kbCb=null,kbLab='';
function kbRows(){ return (kbRu?RU:LAT).map(r=>[...r]).concat([SP]); }
function kbLabText(){ return kbLab+(kbMode==='field'?' · Enter — системный ввод · Esc — сетка букв':' · сетка: ↑↓←→ Enter · Esc — отмена'); }
function kbBuild(){
  const rows=kbRows();
  $('kb').innerHTML=rows.map((rw,r)=>`<div class="kbrow">`+rw.map((k,c)=>{
    const sp=SP.includes(k); const label=(k===' '?'␣':k);
    return `<div class="kbkey ${sp?'sp':''} ${kbMode==='grid'&&r===kbR&&c===kbC?'sel':''}">${label}</div>`;}).join('')+`</div>`).join('');
  if($('ovi').value!==kbBuf)$('ovi').value=kbBuf;
  $('kblab').textContent=kbLabText();
}
function ask(label,cb,val){ kbOn=true; kbMode='field'; kbBuf=val||''; kbR=0; kbC=0; kbRu=/[а-яё]/i.test(val||''); kbCb=cb; kbLab=label; $('ov').style.display='flex'; kbBuild(); setTimeout(()=>$('ovi').focus(),80); }
$('ovi').addEventListener('input',e=>{ kbBuf=e.target.value; $('kblab').textContent=kbLabText(); });
function kbDone(v){ kbOn=false; $('ov').style.display='none'; const cb=kbCb; kbCb=null; cb&&cb(v); }
function kbPress(k){
  if(k==='⌫') kbBuf=kbBuf.slice(0,-1);
  else if(k==='␣'||k===' ') kbBuf+=' ';
  else if(k==='OK') return kbDone(kbBuf.trim());
  else if(k==='✕') return kbDone('');
  else if(k==='EN'){ kbRu=!kbRu; }
  else if(k==='http') kbBuf+='http';
  else if(k==='://') kbBuf+='://';
  else kbBuf+=k;
  kbC=Math.min(kbC,kbRows()[kbR].length-1); kbBuild();
}
function kbKey(e){
  if(kbMode==='field'){
    // не глушим клавиши: нативное поле само решит (Enter на очках открывает системный композер)
    if(e.key==='Escape'){ e.preventDefault(); kbMode='grid'; $('ovi').blur(); kbBuild(); }
    return;
  }
  e.preventDefault(); const rows=kbRows();
  const maxc=rows[kbR].length-1;
  if(e.key==='ArrowLeft') kbC=Math.max(0,kbC-1);
  else if(e.key==='ArrowRight') kbC=Math.min(maxc,kbC+1);
  else if(e.key==='ArrowUp'){ kbR=Math.max(0,kbR-1); kbC=Math.min(kbC,rows[kbR].length-1); }
  else if(e.key==='ArrowDown'){ kbR=Math.min(rows.length-1,kbR+1); kbC=Math.min(kbC,rows[kbR].length-1); }
  else if(e.key==='Enter'){ const k=rows[kbR][kbC]; return kbPress(k===' '?'␣':k); }
  else if(e.key==='Escape') return kbDone('');
  else return;
  kbBuild();
}
/* ======================================================== */

function renderMenu(){
  $('ctx').textContent='меню';
  const rows=[['⌨ Ввести адрес…','']].concat(bms.map(b=>[b[0],b[1]]),[['🔗 Открыть как есть (last)','direct']]);
  $('body').innerHTML=rows.map((r,i)=>`<div class="rowm ${i===sel?'sel':''}">${esc(r[0])}${r[1]?`<span style="color:#555;font-size:17px"> · ${esc(r[1].replace(/^https?:\/\//,'').slice(0,40))}</span>`:''}</div>`).join('');
}
function renderPage(){
  $('ctx').textContent=url.replace(/^https?:\/\//,'').slice(0,40);
  $('body').innerHTML=esc(pages[page]||'(пусто)');
  foot(`стр ${page+1}/${pages.length} · ↑↓ страницы · Enter озвучить · Esc меню`);
}
function paint(){ screen==='menu'?renderMenu():renderPage(); }

function md2text(md){
  md=md.replace(/^Title:.*?\nURL Source:.*?\n(?:Published Time:.*?\n)?Markdown Content:\n/s,'');
  return md.replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/\[([^\]]*)\]\(([^)]*)\)/g,'$1')
    .replace(/^#{1,6}\s+/gm,'— ')
    .replace(/[*_`>#|]/g,'').replace(/\n{3,}/g,'\n\n').trim();
}
function paginate(t){
  const out=[];let cur='';
  for(const ln of t.split('\n')){
    if((cur+'\n'+ln).length>950){out.push(cur);cur=ln;}else cur=(cur?cur+'\n':'')+ln;
    if(cur.length>950){out.push(cur);cur='';}
  }
  if(cur)out.push(cur);
  return out.length?out:['(пусто)'];
}
async function go(u){
  if(!/^https?:\/\//.test(u)){ if(!/^https?:\/\//.test('https://'+u)) u='https://'+u; u='https://'+u.replace(/^https?:\/\//,''); }
  url=u; localStorage.setItem('brLast',u); screen='reader'; page=0; foot('читаю…'); paint2();
  try{
    const r=await fetch('https://r.jina.ai/'+u);
    if(!r.ok) throw new Error('HTTP '+r.status+' (лимит jina — повтори через минуту)');
    pagesText=md2text(await r.text());
    pages=paginate(pagesText);
    page=0; paint();
  }catch(e){ foot('ошибка: '+e.message); screen='menu'; sel=0; paint(); }
}
function paint2(){ $('body').innerHTML='<div style="color:#0f0;padding-top:40px">гружу '+esc(url)+'…</div>'; $('ctx').textContent='читаю'; }

document.addEventListener('keydown',e=>{
  if(kbOn) return kbKey(e);
  const k=e.key; e.preventDefault();
  if(screen==='menu'){
    const n=2+bms.length;
    if(k==='ArrowUp')sel=(sel+n-1)%n;
    if(k==='ArrowDown')sel=(sel+1)%n;
    if(k==='Enter'){ if(sel===0){ ask('Адрес сайта',v=>{ if(v)go(v); else paint(); }); } else if(sel===n-1){ localStorage.getItem('brLast')?go(localStorage.getItem('brLast')):foot('сначала открой что-нибудь'); } else go(bms[sel-1][1]); }
  } else {
    if(k==='ArrowUp')page=Math.max(0,page-1);
    if(k==='ArrowDown')page=Math.min(pages.length-1,page+1);
    if(k==='ArrowLeft')page=Math.max(0,page-5);
    if(k==='ArrowRight')page=Math.min(pages.length-1,page+5);
    if(k==='Enter')say(pages[page]);
    if(k==='Escape'){screen='menu';sel=0;}
  }
  paint();
});
paint();
</script>
</body>
</html>
